# runs on every pull request
name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: 02 tests
    runs-on: ubuntu-24.04
    steps:
      - name: wait until the step releases this commit's CI
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.pull_request.head.sha || github.sha }}/ci-release?ref=jstack-fixtures
        run: |
          until curl -fsS -o /dev/null -H "Authorization: Bearer $GH_TOKEN" "$RELEASE"; do sleep 5; done
      - name: run the runner-a tests
        run: echo "runner-a tests pass"
  merged-dark:
    name: 03 merged-dark
    runs-on: ubuntu-24.04
    steps:
      - name: wait until the step releases this commit's CI
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.pull_request.head.sha || github.sha }}/ci-release?ref=jstack-fixtures
        run: |
          until curl -fsS -o /dev/null -H "Authorization: Bearer $GH_TOKEN" "$RELEASE"; do sleep 5; done
      - name: boot and probe
        run: echo "booted with every flag building; no route of a feature in progress answers"
